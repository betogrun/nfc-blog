# Interface strings, read with t() in layouts and components. Portuguese is in pt.yml.
en:
  # The <html lang> and hreflang code, the Open Graph locale, and the language's own name.
  lang: en
  og_locale: en_US
  language_name: English
  # Post dates, as strftime formats.
  date_format: "%Y-%m-%d"
  tagline:
    # The subtitle's tooltip; {roll} and {sides} are filled in by the page's script.
    rolled: rolled a {roll} on a d{sides}
  nav:
    about: About
    # Before the author's name under the masthead.
    by: by
    language: Language
  theme:
    switch: Switch theme
    to_dark: Switch to dark theme
    to_light: Switch to light theme
  footer:
    elsewhere: Elsewhere
    email: Email
    rss: RSS feed
  post:
    # After the title of a post listed in the other language.
    other_language: in Portuguese
    filed_under: filed under
    share: share
    link_copied: link copied
    copy_failed: copy failed
    more_posts: More posts
    contents: Contents
    enable_javascript: Please enable JavaScript to view the comments.
  code:
    # The button that copies a code block (console blocks copy only their commands).
    copy: Copy
    copied: Copied
    copy_failed: Copy failed
  pagination:
    label: Pagination
    older: Older posts
    newer: Newer posts
    count: page %{page} of %{total}
  tag:
    count:
      one: "%{count} post"
      other: "%{count} posts"
    empty: There are no posts in %{name}.
  tags:
    title: Topics
    summary: "%{topics} topics across %{posts} posts"
  not_found:
    lost: Looks like you got lost.
    back_html: Let's get you back to the <a href="%{home}">homepage</a>!
