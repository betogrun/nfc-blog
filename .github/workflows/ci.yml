name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Use mise's precompiled Ruby instead of building it from source.
      MISE_RUBY_COMPILE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bin/ci
